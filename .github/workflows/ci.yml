name: CI

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:

jobs:
  php:
    name: PHP lint, static analysis, unit + integration tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wptest
          MARIADB_USER: wp
          MARIADB_PASSWORD: wp
        ports: [ '3306:3306' ]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      WP_CORE_DIR: /tmp/wordpress
      WP_TESTS_DB_HOST: 127.0.0.1
      WP_TESTS_DB_NAME: wptest
      WP_TESTS_DB_USER: wp
      WP_TESTS_DB_PASS: wp
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli, sodium, intl, gd, zip
          tools: composer:v2
          coverage: none
      - name: Composer install
        run: composer install --no-interaction --no-progress
      - name: PHPCS (WordPress-Extra, WordPress-Docs)
        run: vendor/bin/phpcs -q
      - name: PHPStan level 6
        run: |
          composer global require --no-interaction phpstan/phpstan:^1.12 szepeviktor/phpstan-wordpress:^1.3
          export PHPSTAN_WP_EXTENSION="$(composer global config home)/vendor/szepeviktor/phpstan-wordpress/extension.neon"
          "$(composer global config home)/vendor/bin/phpstan" analyse --memory-limit=1G --no-progress
      - name: Install WordPress + WooCommerce for tests
        run: bash bin/install-wp-tests.sh
      - name: PHPUnit
        run: vendor/bin/phpunit

  js:
    name: TypeScript + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Build output is committed
        run: git diff --exit-code -- build || (echo "::error::build/ is out of date — run npm run build and commit" && exit 1)
